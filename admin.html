<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>iGlow Beauty | Espace pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#fffaf7;--panel:rgba(255,255,255,.7);--primary:#201814;--primary-soft:#5d4a42;--accent-strong:#f0b08d;--muted:#615551;--line:rgba(32,24,20,.12)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--primary);min-height:100vh}
        .wrap{max-width:900px;margin:0 auto;padding:2.5rem 1.2rem 4rem}
        header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
        header h1{font-size:1.6rem}
        header a{color:var(--primary-soft);text-decoration:underline;font-size:.85rem}
        #logout-button{display:none;background:rgba(32,24,20,.08);border:1px solid var(--line);border-radius:999px;padding:.55rem 1.1rem;font-weight:700;color:var(--primary);cursor:pointer}

        #login-view{max-width:380px;margin:3rem auto 0;padding:2rem;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(52,37,32,.08)}
        #login-view h2{margin-bottom:.4rem}
        #login-view p{color:var(--muted);font-size:.88rem;margin-bottom:1.4rem}
        #login-form{display:grid;gap:.7rem}
        #login-form label{font-size:.73rem;font-weight:800;color:var(--primary-soft)}
        #login-form input{width:100%;border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem;background:rgba(255,255,255,.8);outline:none;font-family:inherit}
        #login-form input:focus{border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(240,176,141,.18)}
        #login-form button{margin-top:.4rem;background:linear-gradient(135deg,#211915 0%,#5d413a 55%,#d0a18a 100%);color:#fff;border:none;border-radius:999px;padding:.85rem;font-weight:800;cursor:pointer}
        #login-status{min-height:1.2em;font-size:.85rem;font-weight:700;color:#a13b2b}

        #admin-view{display:none}
        .message-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 16px 36px rgba(52,37,32,.06)}
        .message-meta{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.82rem;color:var(--muted);margin-bottom:.7rem}
        .message-meta strong{color:var(--primary)}
        .message-body{background:rgba(255,255,255,.6);border-radius:12px;padding:.9rem 1rem;margin-bottom:1rem;white-space:pre-wrap;font-size:.92rem}
        .reply-block textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem;background:rgba(255,255,255,.8);outline:none;font-family:inherit;resize:vertical}
        .reply-block textarea:focus{border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(240,176,141,.18)}
        .reply-actions{display:flex;align-items:center;gap:.8rem;margin-top:.6rem}
        .reply-actions button{background:linear-gradient(135deg,#211915 0%,#5d413a 55%,#d0a18a 100%);color:#fff;border:none;border-radius:999px;padding:.65rem 1.3rem;font-weight:800;cursor:pointer}
        .reply-actions button:disabled{opacity:.6;cursor:default}
        .reply-status{font-size:.82rem;font-weight:700}
        .already-replied{border-left:3px solid #2b7a4b;padding-left:.8rem;font-size:.88rem;color:var(--muted)}
        .already-replied strong{color:#2b7a4b}
        #empty-state,#loading-state{text-align:center;color:var(--muted);padding:3rem 1rem}
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>iGlow Beauty — Espace pro</h1>
            <div style="display:flex;align-items:center;gap:1rem">
                <a href="index.html">Retour au site</a>
                <button id="logout-button" type="button">Se déconnecter</button>
            </div>
        </header>

        <section id="login-view">
            <h2>Connexion admin</h2>
            <p>Réservé à l'équipe iGlow Beauty.</p>
            <form id="login-form">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" required autocomplete="username">
                <label for="login-password">Mot de passe</label>
                <input id="login-password" type="password" required autocomplete="current-password">
                <button type="submit">Se connecter</button>
                <p id="login-status"></p>
            </form>
        </section>

        <section id="admin-view">
            <div id="loading-state">Chargement des messages...</div>
            <div id="empty-state" style="display:none">Aucun message pour le moment.</div>
            <div id="messages-list"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL='https://hjduofhhimdezhywkvlx.supabase.co';
        const SUPABASE_ANON_KEY='sb_publishable_tdvCZON4HcFe_7hmy6Nb-g_m6a8WDhe';
        const supabaseClient=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

        const loginView=document.getElementById('login-view'),adminView=document.getElementById('admin-view'),loginForm=document.getElementById('login-form'),loginStatus=document.getElementById('login-status'),logoutButton=document.getElementById('logout-button'),messagesList=document.getElementById('messages-list'),loadingState=document.getElementById('loading-state'),emptyState=document.getElementById('empty-state');

        function formatDate(iso){
            return new Date(iso).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});
        }

        function renderMessages(messages){
            messagesList.innerHTML='';
            if(!messages.length){
                emptyState.style.display='block';
                return;
            }
            emptyState.style.display='none';
            messages.forEach((msg)=>{
                const card=document.createElement('article');
                card.className='message-card';
                const alreadyReplied=Boolean(msg.admin_reply);
                card.innerHTML=`
                    <div class="message-meta">
                        <span><strong>${msg.name}</strong></span>
                        <span>${msg.phone}</span>
                        <span>${msg.email}</span>
                        <span>${formatDate(msg.created_at)}</span>
                    </div>
                    <div class="message-body">${msg.message}</div>
                    ${alreadyReplied?`<div class="already-replied"><strong>Déjà répondu</strong> le ${formatDate(msg.replied_at)} :<br>${msg.admin_reply}</div>`:`
                    <div class="reply-block">
                        <textarea placeholder="Écrivez votre réponse ici..."></textarea>
                        <div class="reply-actions">
                            <button type="button" class="send-reply-button">Envoyer la réponse</button>
                            <span class="reply-status"></span>
                        </div>
                    </div>`}
                `;
                if(!alreadyReplied){
                    const textarea=card.querySelector('textarea'),button=card.querySelector('.send-reply-button'),status=card.querySelector('.reply-status');
                    button.addEventListener('click',async()=>{
                        const replyText=textarea.value.trim();
                        if(!replyText){
                            status.textContent='Écrivez une réponse avant d\'envoyer.';
                            status.style.color='#a13b2b';
                            return;
                        }
                        button.disabled=true;
                        status.textContent='Envoi en cours...';
                        status.style.color='var(--muted)';

                        const{error:updateError}=await supabaseClient.from('messages').update({admin_reply:replyText,replied_at:new Date().toISOString()}).eq('id',msg.id);
                        if(updateError){
                            status.textContent="Erreur lors de l'enregistrement de la réponse.";
                            status.style.color='#a13b2b';
                            button.disabled=false;
                            return;
                        }

                        const{data:sessionData}=await supabaseClient.auth.getSession();
                        const{error:emailError}=await supabaseClient.functions.invoke('send-reply-email',{
                            body:{messageId:msg.id},
                            headers:{Authorization:`Bearer ${sessionData?.session?.access_token||''}`}
                        });

                        if(emailError){
                            status.textContent='Réponse enregistrée, mais l\'email de notification a échoué.';
                            status.style.color='#a13b2b';
                        }else{
                            status.textContent='Réponse envoyée et email de notification transmis.';
                            status.style.color='#2b7a4b';
                        }
                        loadMessages();
                    });
                }
                messagesList.appendChild(card);
            });
        }

        async function loadMessages(){
            loadingState.style.display='block';
            const{data,error}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:false});
            loadingState.style.display='none';
            if(error){
                messagesList.innerHTML=`<p style="color:#a13b2b">Impossible de charger les messages : ${error.message}</p>`;
                return;
            }
            renderMessages(data||[]);
        }

        async function checkAdminAndShow(){
            const{data:{session}}=await supabaseClient.auth.getSession();
            if(!session){
                loginView.style.display='block';
                adminView.style.display='none';
                logoutButton.style.display='none';
                return;
            }
            const{data:profile,error}=await supabaseClient.from('profiles').select('role').eq('id',session.user.id).single();
            if(error||profile?.role!=='admin'){
                await supabaseClient.auth.signOut();
                loginStatus.textContent="Ce compte n'a pas les droits admin.";
                loginView.style.display='block';
                adminView.style.display='none';
                logoutButton.style.display='none';
                return;
            }
            loginView.style.display='none';
            adminView.style.display='block';
            logoutButton.style.display='inline-flex';
            loadMessages();
        }

        loginForm.addEventListener('submit',async(event)=>{
            event.preventDefault();
            loginStatus.textContent='';
            const email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-password').value;
            const{error}=await supabaseClient.auth.signInWithPassword({email,password});
            if(error){
                loginStatus.textContent='Email ou mot de passe incorrect.';
                return;
            }
            checkAdminAndShow();
        });

        logoutButton.addEventListener('click',async()=>{
            await supabaseClient.auth.signOut();
            checkAdminAndShow();
        });

        if(!supabaseClient){
            loginStatus.textContent='Service indisponible.';
        }else{
            checkAdminAndShow();
        }
    </script>
</body>
</html>
